# API Cache Service - Local build cache
# apilll.frostai.com.tr → localhost:8443 (Cloudflare Tunnel, HTTPS port)

services:
  cache-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: build-cache
    restart: unless-stopped
    ports:
      - "8443:8443"
      - "127.0.0.1:8180:8080"
    volumes:
      - ./config.json:/app/config.json:ro
    networks:
      - cache-net

networks:
  cache-net:
    driver: bridge